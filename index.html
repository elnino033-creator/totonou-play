// 埋め込みフォント（末尾の FONT_DATA）を読み込む。失敗時は Meiryo などで表示される
function loadFont() {
  try {
    if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
    const bin = atob(FONT_DATA);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ff = new FontFace('DotGothic16', bytes.buffer);
    ff.load().then(f => { document.fonts.add(f); }).catch(() => { /* 失敗時は代替フォント */ });
  } catch (e) { /* 失敗時は代替フォント */ }
}

/* =====================================================================
 * サウンド（WebAudio）。音源は末尾の AUDIO_DATA（base64 の mp3）を使用。
 * 初回のタッチ時に初期化する（スマホの自動再生制限対策）。失敗しても無音で動く。
 * ===================================================================== */
const snd = {
  ctx: null, master: null, sfxGain: null, bgmGain: null,
  buf: {},          // デコード済み音声
  bgmSrc: null,     // 再生中のBGM
  bgmName: null,    // 再生中のBGM名
  want: null,       // 再生したいBGM名（デコード完了待ちを含む）
  muted: false
};
try { snd.muted = localStorage.getItem(CONFIG.SOUND_MUTE_KEY) === '1'; } catch (e) { /* 読めなければ音あり */ }

function sndInit() {
  if (snd.ctx) {
    if (snd.ctx.state === 'suspended') snd.ctx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = snd.ctx = new AC();
    snd.master = ac.createGain();
    snd.master.gain.value = snd.muted ? 0 : 1;
    snd.master.connect(ac.destination);
    snd.sfxGain = ac.createGain();
    snd.sfxGain.gain.value = CONFIG.SFX_VOL;
    snd.sfxGain.connect(snd.master);
    snd.bgmGain = ac.createGain();
    snd.bgmGain.gain.value = CONFIG.BGM_VOL;
    snd.bgmGain.connect(snd.master);
    const data = (typeof AUDIO_DATA !== 'undefined') ? AUDIO_DATA : {};
    Object.keys(data).forEach(name => {
      try {
        const bin = atob(data[name]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        ac.decodeAudioData(bytes.buffer, b => {
          snd.buf[name] = b;
          if (snd.want === name) bgmStart(); // BGMのデコードが終わったら再生開始
        }, () => { /* デコード失敗は無視 */ });
      } catch (e) { /* 1音の失敗は無視 */ }
    });
  } catch (e) {
    snd.ctx = null; // 音声が使えない環境では無音で続行
  }
}

// 効果音を鳴らす（vol: 音量倍率、delay: 遅延秒）
function sfx(name, vol, delay) {
  if (!snd.ctx || !snd.buf[name]) return;
  try {
    const s = snd.ctx.createBufferSource();
    s.buffer = snd.buf[name];
    const gn = snd.ctx.createGain();
    gn.gain.value = vol == null ? 1 : vol;
    s.connect(gn);
    gn.connect(snd.sfxGain);
    s.start(snd.ctx.currentTime + (delay || 0));
  } catch (e) { /* 再生失敗は無視 */ }
}

// 心拍の「ドクッ」（素材を使わず合成）
function thump(vol, delay) {
  if (!snd.ctx) return;
  try {
    const t = snd.ctx.currentTime + (delay || 0);
    const o = snd.ctx.createOscillator(), gn = snd.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    gn.gain.setValueAtTime(Math.max(0.001, vol), t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(gn);
    gn.connect(snd.sfxGain);
    o.start(t);
    o.stop(t + 0.2);
  } catch (e) { /* 再生失敗は無視 */ }
}

// BGMの切り替え（同じ曲なら何もしない）
function bgm(name) {
  snd.want = name;
  bgmStart();
}
function bgmStart() {
  const name = snd.want;
  if (!snd.ctx || !snd.buf[name] || snd.bgmName === name) return;
  try {
    if (snd.bgmSrc) snd.bgmSrc.stop();
  } catch (e) { /* 停止済みなら無視 */ }
  try {
    const s = snd.ctx.createBufferSource();
    s.buffer = snd.buf[name];
    s.loop = true;
    s.connect(snd.bgmGain);
    s.start();
    snd.bgmSrc = s;
    snd.bgmName = name;
  } catch (e) { /* 再生失敗は無視 */ }
}

function setMuted(m) {
  snd.muted = m;
  if (snd.master) snd.master.gain.value = m ? 0 : 1;
  try { localStorage.setItem(CONFIG.SOUND_MUTE_KEY, m ? '1' : '0'); } catch (e) { /* 保存失敗は無視 */ }
}

  if (scene === 'sauna' && phase === 'hold') sfx('enter');

  else if (scene === 'vihta' && phase === 'done') sfx(c.seatMul >= 1.1 ? 'tapGood' : 'tapOk');
  else if ((scene === 'mizu' || scene === 'ofuro') && phase === 'hold') sfx('splash', 0.7);
  else if (scene === 'mizu' && phase === 'done') sfx(c.cool >= 0.8 ? 'tapGood' : 'tapOk');
  else if (scene === 'ofuro' && phase === 'done') sfx(c.warmAcc >= 0.8 ? 'tapGood' : 'tapOk');
  else if (scene === 'seat' && phase === 'play') sfx('select');
  else if (scene === 'gaiki' && phase === 'lead') sfx('select');
  else if (scene === 'cutin') stageJingle();
  else if (scene === 'gaiki' && phase === 'done') sfx(c.breath >= 0.5 ? 'result' : 'tapOk');
  else if (scene === 'timeup') sfx('finish');
  else if (scene === 'freeze') sfx('tapMiss');
  else if (scene === 'ending') {
    const k = endingKind();
    if (k === 'totonoi') { sfx('totonoi'); sfx('totonoiLong', 1, CONFIG.TOTONOI_JINGLE_DELAY); }
    else if (k === 'iiburo') { sfx('result'); sfx('totonoiLong', 1, CONFIG.TOTONOI_JINGLE_DELAY); }
    else if (k === 'hospital') sfx('nobose');
    else if (k === 'cold') sfx('tapMiss');

  }
  else if (scene === 'result') {
    if (g.newRecord) { sfx('record'); sfx('totonoi', 1, CONFIG.TOTONOI_JINGLE_DELAY); }
    else sfx('finish');
  }
}

  const st = ST(), a = CONFIG.ACTIONS[id];
  sfx('select');
  newCur();
  g.actId = id;
  const c = g.cur;
  if (a.type === 'sauna') {
    g.saunaCount++;
    c.heat = heatFromTemp(g.temp); // 今の体温から始める（お風呂で温まっていれば熱が溜まった状態）
    if (st.rooms) openChoice('sauna'); else go('sauna', 'hold');
  } else if (id === 'lake') {
    g.lake = { hole: rand(0.25, 0.8), pos: 0, hit: false };
    go('lake', 'play');
  } else if (a.type === 'water') {
    c.T = g.temp;                  // 今の体温から冷やす
    if (st.cools) openChoice('cool'); else go('mizu', 'hold');
  } else if (a.type === 'rest') {
    if (st.seat) seatStart((st.seats && st.seats[id]) || st.seat); // 外気浴・内気浴で混み具合が違う
    else { c.seatType = '丸太ベンチ'; c.seatMul = 1; go('gaiki', 'lead'); }
  } else if (a.type === 'bath') {
    c.T = g.temp;                  // 今の体温から温める
    go('ofuro', 'hold');
  } else if (id === 'vihta') {
    c.vihta = 0;
    go('vihta', 'lead');
  }
}

// 行動の完了（q: 出来ばえ0〜1、bm: ルートに掛かる部屋・極寒ボーナス、detail: 結果の表示）
function actionDone(id, q, bm, detail, over) {
  const a = CONFIG.ACTIONS[id], type = a.type;
  const ev = flowOf(g.lastType, type);
  if (ev === 'good') g.combo++;
  else if (ev === 'bad') g.combo = 0;
  g.maxCombo = Math.max(g.maxCombo, g.combo);
  const cm = 1 + CONFIG.COMBO_STEP * Math.min(g.combo, CONFIG.COMBO_MAX);
  const am = a.mul || 1;                                   // 行動の倍率（外気浴ボーナスなど）
  const pts = Math.round(CONFIG.ACTION_BASE * q * cm * am);
  g.total += pts;
  g.actions++;
  g.hist.push({ id, type, q, bm: (bm || 1) * am, detail, over: !!over, vihta: type === 'sauna' && (g.cur.vihtaN || 0) > 0 });
  if (type === 'bath') g.bathCount++;
  if (type === 'rest') g.restCount++;
  if (g.hist.length > 12) g.hist.shift();
  g.lastAct = { name: a.name, q, pts, ev, detail };
  g.lastType = type;
  g.lastQ = q;
  // 体のほてり（見た目用）
  g.bodyHeat = clamp((g.temp - CONFIG.BODY_TEMP) / (CONFIG.SAUNA_TEMP_MAX - CONFIG.BODY_TEMP), 0, 1); // 体温から
  // ルート判定
  const r = matchRoute();
  if (r) {
    const steps = g.hist.slice(-r.seq.length);
    const qs = (r.q > 0 ? steps.slice(-r.q) : steps).reduce((m, e) => m * e.q, 1);
    const bms = steps.reduce((m, e) => m * e.bm, 1);
    const bonus = Math.round(r.base * r.mul * qs * bms * (1 + CONFIG.ROUTE_COMBO_STEP * Math.min(g.combo, CONFIG.COMBO_MAX)));
    const isNew = g.found.indexOf(r.id) < 0;
    if (isNew) { g.found.push(r.id); saveRoutes(g.found); }
    g.total += bonus;
    g.routeLog.push(r.name);
    if (isNew) g.newFound.push(r.name);
    // ととのった判定: サウナ→水→休憩の流れで、水風呂で冷やしすぎず、ちゃんと冷えていること
    if (r.zen) {
      const w = steps.slice().reverse().find(e => e.type === 'water'); // 直近の水風呂で判定（連続ととのいでも最後の水風呂）
      if (w && !w.over && w.q >= CONFIG.TOTONOI_COOL_MIN) g.totonoiCount++;
    }
  }
  // チュートリアル: 案内どおりの行動なら次へ。休憩まで終えたら、ととのえたか判定
  if (ST().tutorial && type === CONFIG.ACTIONS[CONFIG.TUTORIAL_ORDER[g.tutI]].type) {
    g.tutI++;
    if (g.tutI >= CONFIG.TUTORIAL_ORDER.length) {
      if (g.totonoiCount > 0) { finishStage('tutorial'); return; }
      g.tutI = 1;            // ととのえなかったらサウナからやり直し
      g.tutRetry = true;
    }
  }
  go('hub', 'show'); // ルート達成はプレイ中に表示しない（閉館後の結果で発表）
}

// 失敗（のぼせ・強制退出）: コンボと流れが切れる
function actionFail(reason) {
  g.combo = 0;
  g.hist = [];
  g.lastType = 'start';
  g.lastQ = 0;
  g.bodyHeat = 0;
  g.lastAct = { fail: reason };
  go('hub', 'show');
}

// 直近の行動に一致するルート（長い順、同じ長さは定義順）
function matchRoute() {
  const st = ST();
  const types = g.hist.map(e => e.type);
  const cands = CONFIG.ROUTES.filter(r => !r.stage || r.stage === st.id)
    .filter(r => r.seq.length <= types.length && r.seq.every((t, i) => types[types.length - r.seq.length + i] === t))
    .filter(r => r.need !== 'vihta' || g.hist.slice(-r.seq.length).some(e => e.vihta)); // サウナでヴィヒタを使ったか
  if (!cands.length) return null;
  cands.sort((a, b) => b.seq.length - a.seq.length);
  return cands[0];
}

// そのステージで達成できるルート
const stageRoutes = () => CONFIG.ROUTES.filter(r => !r.stage || r.stage === ST().id);

// 選択フェーズ（kind: 'sauna' サウナ室 / 'cool' クールダウン）
function openChoice(kind) {
  const st = ST();
  let opts;
  if (kind === 'sauna') {
    opts = st.rooms.slice().sort(() => Math.random() - 0.5).slice(0, st.offer)
      .map(k => Object.assign({ key: k }, CONFIG.ROOMS[k]));
  } else {
    opts = st.cools;
  }
  g.choice = { kind, opts };
  go('choose', 'show');
}
const choiceRect = i => ({ x: 20, y: H - 12 - (g.choice ? g.choice.opts.length : 2) * 136 + i * 136, w: 320, h: 124 }); // 下詰め
function choose(i) {
  const c = g.cur, o = g.choice.opts[i];
  sfx('select');
  if (g.choice.kind === 'sauna') { c.room = o.key; go('sauna', 'hold'); }   // 予熱（c.heat）は保持
  else { c.coolOpt = o; go('mizu', 'hold'); }
}
// 現在のサウナ室
const roomCfg = () => CONFIG.ROOMS[g.cur ? g.cur.room : 'std'];

// サウナ内のヴィヒタ（血行アップ: しばらく体温の上がり方が速くなる）
function useVihta() {
  const c = g.cur;
  c.vihtaN = (c.vihtaN || 0) + 1;
  c.vihtaT = CONFIG.VIHTA_BOOST_SEC;
  g.vihtaSwing = 0.25;
  sfx('tapOk', 0.6);
}

// セルフロウリュ（やりすぎると怒られる）
function selfLoyly() {
  const c = g.cur;
  c.selfCount++;
  if (c.selfCount > CONFIG.SELF_LOYLY_LIMIT) { go('angry', 'anim'); return; }
  c.heat += CONFIG.SELF_LOYLY_JUMP;
  c.hotHeat += CONFIG.SELF_LOYLY_JUMP;
  c.boostT = CONFIG.SELF_LOYLY_SEC;
  g.shakeKick = 0.2;
  sfx('splash');
  spawnSteam(14, 250, 345, 420);
}

// 残り実時間（秒）
const remainSec = () => Math.max(0, ST().realSec - g.stageTime);
// 残りゲーム内時間（分）
const remainMin = () => Math.ceil(remainSec() * ST().gameMin / ST().realSec);

// 外気浴の拍の数（円が最大になる瞬間の数）
// 休憩で経過した拍の数（円が最大になる瞬間: 0.5周期, 1.5周期, …）
const breathBeats = t => Math.floor(t / CONFIG.BREATH_PERIOD + 0.5);

// 倒れて強制終了（スコア0）
function collapseStage(kind) {
  g.collapse = kind;
  finishStage(kind);
}

function finishStage(reason) {
  g.endReason = reason;
  g.final = g.collapse ? 0 : g.total + g.bonus; // 倒れたらスコア0
  if (ST().tutorial) g.final = reason === 'tutorial' ? 1 : 0; // チュートリアルは「クリア（1）」だけを記録
  const id = ST().id;
  g.newRecord = g.final > (g.hi[id] || 0);
  if (g.newRecord) {
    g.hi[id] = g.final;
    saveHi(g.hi);
  }
  go('ending', 'show'); // 結果発表の前にエンディング演出
}

/* =====================================================================
 * 入力（タッチ・マウス・キーボード共通）
 * ===================================================================== */
const pointers = new Set();
const BTN_RETRY = { x: 14, y: 556, w: 104, h: 46 };
const BTN_SELECT = { x: 128, y: 556, w: 104, h: 46 };
const BTN_TITLE = { x: 242, y: 556, w: 104, h: 46 };
const BTN_BACK = { x: 8, y: 6, w: 76, h: 28 };
const MUTE_BTN = { x: W - 34, y: 6, w: 28, h: 28 };   // ミュートボタンの見た目
const MUTE_HIT = { x: W - 46, y: 0, w: 46, h: 44 };   // ミュートボタンの判定（大きめ）
// サウナ内の追加ボタン（下部の左側。右下は「出る」）: セルフロウリュの部屋は「ロウリュ」、フィンランドは「ヴィヒタ」
function saunaBtns() {
  const list = [];
  if (roomCfg().self) list.push({ id: 'loyly', label: 'ロウリュ', color: '#6d4c41' });
  if (ST().finland) list.push({ id: 'vihta', label: 'ヴィヒタ', color: '#558b2f' });
  const w = list.length > 1 ? 84 : 176;
  return list.map((b, i) => Object.assign(b, { r: { x: 12 + i * (w + 8), y: 560, w, h: 62 } }));
}
const EXIT_BTN = { x: 196, y: 560, w: 152, h: 62 }; // サウナ・水風呂・お風呂の「出る」ボタン（右利きに合わせて右下）
const BTN_START = { x: 60, y: 556, w: 240, h: 58 };  // タイトルの「スタート」
const BTN_ENTER = { x: 60, y: 556, w: 240, h: 58 };  // 導入の「入館する」
// 行動ボタン（画面下部に下詰めで並べる）
const hubRect = i => {
  const rows = Math.ceil(ST().actions.length / 2);
  return { x: 16 + (i % 2) * 168, y: H - 10 - rows * 84 + Math.floor(i / 2) * 84, w: 160, h: 74 };
};
const cardRect = i => ({ x: 16, y: 50 + i * 98, w: 328, h: 90 });
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

// 押した瞬間（key: キーボードからの操作）
function onDown(x, y, key) {
  if (!key && inRect(MUTE_HIT, x, y)) { // ミュート切替（ゲーム操作としては扱わない）
    setMuted(!snd.muted);
    return;
  }
  switch (g.scene) {
    case 'title':
      if (g.t > 0.3) { sfx('select'); go('select', 'show'); }
      break;
    case 'select':
      if (g.t < 0.2) break;
      if (key) { openIntro(g.stageIdx); break; }
      if (inRect(BTN_BACK, x, y)) { go('title', 'show'); break; }
      for (let i = 0; i < CONFIG.STAGES.length; i++) {
        if (inRect(cardRect(i), x, y) && stageOpen(i)) { sfx('select'); openIntro(i); break; }
      }
      break;
    case 'cutin':
      if (g.t >= CONFIG.CUTIN_SKIP_SEC) beginStage();
      break;
    case 'intro':
      if (g.t < 0.4) break;
      if (!key && inRect(BTN_BACK, x, y)) go('select', 'show');
      else go('cutin', 'show'); // 入館 → カットイン → 行動えらび
      break;
    case 'hub': {
      if (g.t < CONFIG.HUB_LOCK_SEC) break;
      const acts = ST().actions, tutId = tutAction();
      if (key) { chooseAction(tutId || acts[0]); break; }
      for (let i = 0; i < acts.length; i++) {
        if (inRect(hubRect(i), x, y) && (!tutId || acts[i] === tutId)) { chooseAction(acts[i]); break; }
      }
      break;
    }
    case 'choose':
      if (g.t < 0.25) break;
      if (key) { choose(0); break; }
      for (let i = 0; i < g.choice.opts.length; i++) if (inRect(choiceRect(i), x, y)) { choose(i); break; }
      break;
    case 'sauna':
      if (g.phase !== 'hold') break;
      if (!key && inRect(EXIT_BTN, x, y)) { go('sauna', 'exit'); break; } // 退出
      {
        const b = key ? null : saunaBtns().find(bb => inRect(bb.r, x, y));
        if (b && b.id === 'loyly') selfLoyly();                                  // ロウリュボタン
        else if (b && b.id === 'vihta') useVihta();                              // ヴィヒタボタン
        else { g.cur.heat += CONFIG.TAP_HEAT; sfx('tapOk', 0.4); spawnSteam(4, 250, 345, 420); } // 温度アップ
      }
      break;
    case 'angry':
      if (g.t >= 1.0) actionFail('angry');
      break;
    case 'vihta':
      if (g.phase === 'play') { g.cur.vihta++; g.vihtaSwing = 0.15; sfx('tapOk', 0.5); }
      break;
    case 'lake':
      if (g.phase === 'play' && g.t > 0.3) lakeDive();
      break;
    case 'mizu':
    case 'ofuro':
      if (g.phase !== 'hold') break;
      if (!key && inRect(EXIT_BTN, x, y)) zoneFinish();               // 出る（ここで判定）
      else {                                                         // 深く沈む／肩までつかる
        const z = zoneCfg();
        g.cur.T += z.dir * z.tap;
        sfx('tapOk', 0.4);
      }
      break;
    case 'seat':
      if (g.phase === 'play') seatTap(x, y, key);
      break;
    case 'gaiki':
      if (!key && inRect(EXIT_BTN, x, y) && (g.phase === 'lead' || g.phase === 'play')) gaikiFinish(); // 休憩をやめる
      else if (g.phase === 'play') gaikiTap();
      break;
    case 'nobose':
      if (g.t >= CONFIG.NOBOSE_SKIP_SEC) collapseStage('hot');
      break;
    case 'freeze':
      if (g.t >= CONFIG.NOBOSE_SKIP_SEC) collapseStage('cold');
      break;
    case 'timeup':
      if (g.t >= 1.0) finishStage('time');
      break;
    case 'ending':
      if (g.t >= CONFIG.ENDING_SKIP_SEC) go('result', 'show');
      break;
    case 'result':
      if (g.t < CONFIG.RESULT_LOCK_SEC) break;
      if (key || inRect(BTN_RETRY, x, y)) beginStage();
      else if (inRect(BTN_SELECT, x, y)) { sfx('select'); go('select', 'show'); }
      else if (inRect(BTN_TITLE, x, y)) { sfx('select'); go('title', 'show'); }
      break;
  }
}

// 離した瞬間（全ての指が離れたとき）。長押し操作は廃止したため現在は何もしない
function onUp() {}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* 非対応環境は無視 */ }
  sndInit(); // 最初のタッチで音声を有効化
  const p = toLogical(e);
  pointers.add(e.pointerId);
  onDown(p.x, p.y, false);
});
function pointerEnd(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) onUp();
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('lostpointercapture', pointerEnd);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// PC 用: スペースキーで操作
let keyHeld = false;
window.addEventListener('keydown', e => {
  // PC: Lキーでロウリュ、Vキーでヴィヒタ（サウナの中）
  if (g.scene === 'sauna' && g.phase === 'hold') {
    if (e.code === 'KeyL' && roomCfg().self) { selfLoyly(); return; }
    if (e.code === 'KeyV' && ST().finland) { useVihta(); return; }
  }
  // PC: Enterキーで「出る」
  if (e.code === 'Enter') {
    if (g.scene === 'sauna' && g.phase === 'hold') go('sauna', 'exit');
    else if ((g.scene === 'mizu' || g.scene === 'ofuro') && g.phase === 'hold') zoneFinish();
    else if (g.scene === 'gaiki' && (g.phase === 'lead' || g.phase === 'play')) gaikiFinish();
    return;
  }
  if (e.code !== 'Space' || keyHeld) return;
  e.preventDefault();
  keyHeld = true;
  sndInit();
  onDown(W / 2, H / 2, true);
});
window.addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  keyHeld = false;
  if (pointers.size === 0) onUp();
});

// 画面が隠れたら押下を解除（長押しが残り続けるのを防ぐ）
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pointers.clear();
    keyHeld = false;
    onUp();
    if (snd.ctx) snd.ctx.suspend(); // 非表示中は音を止める
  } else if (snd.ctx) {
    snd.ctx.resume();
  }
});

function stageOpen(i) {
  const prev = CONFIG.STAGES[i - 1];
  if (CONFIG.UNLOCK_ALL || !prev || prev.tutorial) return true; // チュートリアルとステージ1は最初から選べる
  return (g.hi[prev.id] || 0) >= prev.ranks[1]; // 前のステージで「常連」以上
}

/* =====================================================================
 * 各工程のロジック
 * ===================================================================== */
// 水風呂・お風呂の設定（体温で判定。dir: -1 冷える / +1 温まる、単位はすべて℃）
// ステージの目標値（降下量・上昇量 0〜100）を体温に換算する: 水風呂 1 = 0.03℃、お風呂 1 = 0.04℃
function zoneCfg() {
  const st = ST(), C = CONFIG;
  const c = g.cur, co = c && c.coolOpt;
  const zb = (g.lastType === 'sauna' && C.ROOMS[g.lastRoom].zoneBonus) || 0; // 塩サウナの直後はゾーンが広い
  if (g.scene === 'mizu') {
    const u = (C.MIZU_TEMP_START - C.MIZU_TEMP_MIN) / C.MIZU_MAX;
    const target = co ? co.target : st.mizuTarget;
    const tw = co ? co.tc : st.mizuTc, cond = co ? co.conduct : 1;          // 水温が低いほど速く冷える
    const rate = C.MIZU_RATE_AT_18 * (C.BODY_TEMP - tw) / (C.BODY_TEMP - 18) * cond * tempRamp();
    return { dir: -1, rate: rate * u, tap: C.TAP_ZONE * u, temp: C.MIZU_TEMP_START - target * u,
      tol: target * u, zone: ((co ? co.zone : st.mizuZone) + zb) * u, limit: C.MIZU_TEMP_MIN };
  }
  const u = (C.BATH_TEMP_MAX - C.BATH_TEMP_START) / C.WARM_MAX;
  const rateB = C.BATH_RATE_AT_42 * (st.bathTc - C.BODY_TEMP) / (42 - C.BODY_TEMP) * tempRamp(); // 湯温が高いほど速く温まる
  return { dir: 1, rate: rateB * u, tap: C.TAP_ZONE * u, temp: C.BATH_TEMP_START + st.warmTarget * u,
    tol: st.warmTarget * u, zone: st.warmZone * u, limit: C.BATH_TEMP_MAX };
}
// 閉館が近づくほど体温の変化が速くなる（1 〜 1 + ramp）
const tempRamp = () => { const st = ST(); return 1 + (st.ramp || 0) * clamp(g.stageTime / st.realSec, 0, 1); };
// 今のサウナ室の室温（℃）
const saunaTc = () => { const r = roomCfg(); return r.tc || ST().saunaTc; };
// サウナの熱上昇（/秒）: 室温 − 36.5℃ に比例
const saunaRate = () => CONFIG.SAUNA_RATE_AT_90 * (saunaTc() - CONFIG.BODY_TEMP) / (90 - CONFIG.BODY_TEMP) * (roomCfg().humid || 1) * tempRamp();

// サウナの熱（0〜100）と体温の換算
const heatFromTemp = t => (t - CONFIG.BODY_TEMP) / (CONFIG.SAUNA_TEMP_MAX - CONFIG.BODY_TEMP) * 100;

// 離した（または上限到達）時の確定
function zoneFinish() {
  const c = g.cur, z = zoneCfg();
  const acc = clamp(1 - Math.abs(c.T - z.temp) / z.tol, 0, 1); // 理想の体温との差
  g.temp = c.T;                                                 // 体温を引き継ぐ
  if (g.scene === 'mizu') {
    c.cool = acc;
  } else {
    c.warmAcc = acc;
    c.warmMul = lerp(CONFIG.WARM_MIN_MUL, 1, acc);
  }
  go(g.scene, 'done');
}

// 休憩席: 開始
function seatStart(cfg) {
  const order = [0, 1, 2, 0, 1, 2].slice(0, cfg.chairs).sort(() => Math.random() - 0.5); // 椅子の種類を混ぜる
  const freeIdx = [...Array(cfg.chairs).keys()].sort(() => Math.random() - 0.5).slice(0, cfg.startFree);
  const chairs = [];
  for (let i = 0; i < cfg.chairs; i++) {
    const free = freeIdx.indexOf(i) >= 0;
    chairs.push({
      type: order[i], free, npc: Math.floor(Math.random() * 2),
      timer: free ? rand(cfg.freeLife[0], cfg.freeLife[1]) : rand(cfg.occLife[0], cfg.occLife[1])
    });
  }
  g.seat = { chairs, lock: 0, bump: -1, picked: -1, cfg };
  go('seat', 'play');
}

// 休憩席: 椅子の位置
function chairRect(i) {
  const n = g.seat.chairs.length, w = 58, gap = 8;
  const x0 = (W - (n * w + (n - 1) * gap)) / 2;
  return { x: x0 + i * (w + gap), y: 230, w, h: 120 };
}

// 休憩席: タップ判定
function seatTap(x, y, key) {
  const s = g.seat;
  if (s.lock > 0) return;
  let idx = -1;
  if (key) { // キーボードは空いている最初の椅子
    idx = s.chairs.findIndex(ch => ch.free);
  } else {
    for (let i = 0; i < s.chairs.length; i++) if (inRect(chairRect(i), x, y)) idx = i;
  }
  if (idx < 0) return;
  const ch = s.chairs[idx];
  if (ch.free) {
    const t = CONFIG.SEAT_TYPES[ch.type];
    g.cur.seatType = t.name;
    g.cur.seatMul = t.mul;
    s.picked = idx;
    sfx('tapGood');
    go('seat', 'done');
  } else {
    s.lock = CONFIG.SEAT_BUMP_LOCK; // 使用中の椅子に突撃 → 少し動けない
    s.bump = idx;
    sfx('tapMiss');
  }
}

// 外気浴（息を整える）: タップ判定（最寄りの拍とのズレから精度を算出）
function gaikiTap() {
  const c = g.cur;
  const P = CONFIG.BREATH_PERIOD;
  const k = Math.max(0, Math.round(g.t / P - 0.5));
  const d = Math.abs(g.t - (k + 0.5) * P);
  const acc = clamp(1 - d / CONFIG.BREATH_TOL, 0, 1);
  c.taps.push({ t: g.t, acc });
  c.best[k] = Math.max(c.best[k] || 0, acc);
  sfx(acc >= 0.8 ? 'tapGood' : (acc > 0 ? 'tapOk' : 'tapMiss'));
}

// 外気浴: 終了時の呼吸精度（同じ拍の重複タップは最良のみ加点、分母はタップ数と拍数の大きい方）
function gaikiFinish() {
  const c = g.cur;
  c.beats = g.phase === 'play' ? breathBeats(g.t) : 0; // 休んでいた間の拍の数
  let sum = 0;
  for (let k = 0; k < c.beats; k++) sum += c.best[k] || 0;
  const denom = Math.max(c.taps.length, c.beats);
  c.breath = denom > 0 ? clamp(sum / denom, 0, 1) : 0;
  go('gaiki', 'done');
}

// 自動ロウリュの状態（'none' / 'warn' / 'active'）
function eventState() {
  const st = ST(), ev = st.event;
  if (!ev) return { state: 'none', k: 0 };
  const secPerMin = st.realSec / st.gameMin;
  for (let k = 1; k * ev.everyMin < st.gameMin; k++) {
    const t0 = k * ev.everyMin * secPerMin;
    if (g.stageTime >= t0 - ev.warnSec && g.stageTime < t0) return { state: 'warn', k };
    if (g.stageTime >= t0 && g.stageTime < t0 + ev.durSec) return { state: 'active', k };
  }
  return { state: 'none', k: 0 };
}

// 湖ダイブ: 走る位置（0〜1を往復する三角波）
function lakePos(t) {
  const u = (t * CONFIG.LAKE_SPEED) % 1;
  return u < 0.5 ? u * 2 : 2 - u * 2;
}
// 湖ダイブ: タップで飛び込む（穴との距離で冷却適正）
function lakeDive() {
  const L = g.lake, c = g.cur;
  const d = Math.abs(L.pos - L.hole);
  L.hit = d <= CONFIG.LAKE_HOLE_HALF;
  c.cool = clamp(1 - d / CONFIG.LAKE_TOL, CONFIG.LAKE_MIN, 1);
  g.temp = Math.max(CONFIG.MIZU_TEMP_MIN + 0.2, g.temp - (L.hit ? CONFIG.LAKE_COOL_HIT : CONFIG.LAKE_COOL_MISS));
  sfx(L.hit ? 'splash' : 'tapMiss');
  go('lake', 'jump');
}

// ロウリュサウナの定期ロウリュ中か（入室からの経過で判定）
function roomLoylyOn() {
  const room = roomCfg();
  if (!room.loylyEvery || g.scene !== 'sauna' || g.phase !== 'hold') return false;
  return (g.t % room.loylyEvery) >= room.loylyEvery - room.loylySec;
}

// 心拍の包絡（ドクン・ドクンの2段）
function bump(p, s, w) { return p >= s && p < s + w ? Math.sin(Math.PI * (p - s) / w) : 0; }
function heartEnv(p) { return Math.max(bump(p, 0, 0.16), 0.6 * bump(p, 0.3, 0.16)); }

function spawnSteam(n, x0, x1, y) {
  for (let i = 0; i < n && g.steam.length < 60; i++) {
    g.steam.push({ x: rand(x0, x1), y, vy: rand(22, 46), life: 0, max: rand(1.4, 2.6), s: Math.round(rand(3, 7)) * 2 });
  }
}

/* =====================================================================
 * 更新
 * ===================================================================== */
function update(dt) {
  g.t += dt;
  g.anim += dt;
  g.shakeKick = Math.max(0, g.shakeKick - dt);
  const c = g.cur, st = ST();

  // 湯気の発生と移動
  if ((g.scene === 'title' || g.scene === 'sauna' || g.scene === 'nobose' || g.scene === 'ofuro') && Math.random() < dt * 16) {
    if (g.scene === 'title') spawnSteam(1, 20, W - 20, 520);
    else if (g.scene === 'ofuro') spawnSteam(1, 30, W - 30, 450);
    else spawnSteam(1, 268, 336, 400);
  }
  for (const s of g.steam) { s.life += dt; s.y -= s.vy * dt; s.x += Math.sin(s.life * 3 + s.x) * 6 * dt; }
  g.steam = g.steam.filter(s => s.life < s.max);

  // 心拍（サウナ中は熱に応じて加速）
  let bpm = CONFIG.HEART_BPM_MIN;
  if (c && (g.scene === 'sauna' || g.scene === 'nobose')) {
    bpm = lerp(CONFIG.HEART_BPM_MIN, CONFIG.HEART_BPM_MAX, clamp(c.heat / 100, 0, 1));
  }
  const beatPrev = Math.floor(g.heartPhase);
  g.heartPhase += bpm / 60 * dt;
  if (g.scene === 'sauna' && g.phase === 'hold' && Math.floor(g.heartPhase) > beatPrev) {
    const v = CONFIG.HEART_THUMP_VOL * (0.35 + 0.65 * clamp(c.heat / 100, 0, 1));
    thump(v, 0);
    thump(v * 0.6, CONFIG.HEART_DUB_DELAY); // ドクン・ドクンの2打目
  }

  // 制限時間（入館中のみ進む）
  if (PLAY_SCENES.indexOf(g.scene) >= 0) {
    g.stageTime += dt;
    // 自動ロウリュの発動（1回ごとに1度だけ）
    const ev = eventState();
    if (ev.state === 'active' && ev.k > g.evK) {
      g.evK = ev.k;
      sfx('splash');
      spawnSteam(24, 250, 345, 420);
    }
    if (!st.tutorial && g.stageTime >= st.realSec) { // 閉館（途中のセットは無効）。チュートリアルは時間制限なし
      go('timeup', 'show');
      return;
    }
  }

  if (g.scene === 'seat' || (g.scene === 'gaiki' && g.phase !== 'done')) {
    g.temp += (CONFIG.BODY_TEMP - g.temp) * CONFIG.REST_RECOVER * dt; // 低ければ上がり、高ければ下がる
  }

  g.vihtaSwing = Math.max(0, (g.vihtaSwing || 0) - dt);

  switch (g.scene) {
    case 'sauna': {
      const boss = st.boss;
      if (g.phase === 'hold') {
        const ev = eventState(), room = roomCfg();
        c.boostT = Math.max(0, c.boostT - dt);
        let mul = 1;
        if (ev.state === 'active') mul *= st.event.heatMul;                 // 施設の自動ロウリュ
        if (roomLoylyOn()) mul *= room.loylyMul;                             // ロウリュサウナの定期ロウリュ
        if (c.boostT > 0) mul *= CONFIG.SELF_LOYLY_MUL;                      // セルフロウリュ直後
        const hot = mul > 1;                                                 // 高温（ロウリュ）中か
        c.vihtaT = Math.max(0, (c.vihtaT || 0) - dt);
        if (c.vihtaT > 0) mul *= CONFIG.VIHTA_BOOST_MUL;                     // ヴィヒタで血行アップ（高温ボーナスには数えない）
        const add = (saunaRate() * CONFIG.AUTO_SAUNA_MUL * mul + CONFIG.SAUNA_HEAT_ACCEL * (c.heat / 100)) * dt;
        c.heat += add;
        if (hot) c.hotHeat += add;                                           // 高温中に溜めた熱はボーナス対象
        const lon = roomLoylyOn();
        if (lon && !c.loylyWas) { sfx('splash', 0.6); spawnSteam(12, 250, 345, 420); } // 定期ロウリュの開始
        c.loylyWas = lon;
        // 熱波士の熱波
        if (boss) {
          g.boss.waveT -= dt;
          g.boss.hitT = Math.max(0, g.boss.hitT - dt);
          if (g.boss.waveT <= 0) {
            c.heat += boss.heat;
            c.hotHeat += boss.heat;
            g.boss.waveT = boss.waveEvery;
            g.boss.hitT = 0.35;
            g.shakeKick = 0.35;
            sfx('splash');
          }
        }
        if (c.heat > CONFIG.SAUNA_LIMIT) { // 100超えでのぼせ
          c.nobose = true;
          g.noboseCount++;
          g.collapseWhere = 'sauna';
          go('nobose', 'anim');
        }
      } else {
        if (boss) { g.boss.waveT = boss.firstWave; g.boss.hitT = 0; }
        if (g.phase === 'exit' && g.t >= CONFIG.SAUNA_EXIT_SEC) {
          const heat01 = clamp(c.heat / 100, 0, 1);
          // 部屋・高温ボーナス（部屋補正 × 高温に耐えた分）
          c.bonusMul = roomCfg().mul * (1 + CONFIG.HOT_BONUS * Math.min(c.hotHeat, c.heat) / 100);
          g.lastRoom = c.room;
          g.temp = bodyTemp('sauna', c.heat); // 体温を引き継ぐ
          actionDone('sauna', heat01, c.bonusMul, '熱 ' + pct(heat01) + (c.bonusMul !== 1 ? ' ×' + c.bonusMul.toFixed(2) : ''));
        }
      }
      break;
    }

    case 'nobose':
      if (g.t >= CONFIG.NOBOSE_SEC) collapseStage('hot');  // 高温で倒れる → 病院送り（強制終了）
      break;

    case 'freeze':
      if (g.t >= CONFIG.FREEZE_SEC) collapseStage('cold'); // 低温で倒れる → 風邪（強制終了）
      break;

    case 'angry':
      if (g.t >= CONFIG.ANGRY_SEC) actionFail('angry');   // 怒られても流れが切れる
      break;

    case 'vihta': // （未使用: ヴィヒタはサウナの中のボタンに移行）
      if (g.phase === 'lead' && g.t >= CONFIG.VIHTA_LEAD) go('vihta', 'play');
      else if (g.phase === 'play' && g.t >= CONFIG.VIHTA_SEC) {
        const k = clamp(c.vihta / CONFIG.VIHTA_TARGET, 0, 1);
        c.vihtaK = k;
        c.seatMul = lerp(CONFIG.VIHTA_MIN, CONFIG.VIHTA_MAX, k); // ヴィヒタ補正（ルートに掛かる）
        go('vihta', 'done');
      } else if (g.phase === 'done' && g.t >= CONFIG.VIHTA_DONE_SEC) {
        actionDone('vihta', lerp(0.75, 1, c.vihtaK), c.seatMul, '血行 ' + pct(c.vihtaK));
      }
      break;

    case 'lake':
      if (g.phase === 'play') g.lake.pos = lakePos(g.t);
      else if (g.phase === 'jump' && g.t >= CONFIG.LAKE_JUMP_SEC) go('lake', 'done');
      else if (g.phase === 'done' && g.t >= CONFIG.LAKE_DONE_SEC) actionDone('lake', c.cool, 1, (g.lake.hit ? 'ドボン ' : '激突 ') + '冷却 ' + pct(c.cool));
      break;

    case 'mizu':
    case 'ofuro': {
      const z = zoneCfg();
      if (g.phase === 'hold') {
        c.T += z.dir * z.rate * CONFIG.AUTO_ZONE_MUL * dt;
        if (z.dir < 0 ? c.T <= z.limit : c.T >= z.limit) { // 体温が限界に達したら倒れる
          c.T = z.limit;
          g.temp = c.T;
          if (g.scene === 'mizu') go('freeze', 'anim');
          else { g.collapseWhere = 'bath'; go('nobose', 'anim'); }
        }
      } else if (g.phase === 'done') {
        if (g.scene === 'mizu' && g.t >= CONFIG.MIZU_DONE_SEC) actionDone(g.actId, c.cool, c.coolOpt ? c.coolOpt.mul : 1, '冷却 ' + pct(c.cool), c.T < z.temp - z.zone); // 理想より冷えすぎ
        else if (g.scene === 'ofuro' && g.t >= CONFIG.WARM_DONE_SEC) actionDone(g.actId, c.warmAcc, 1, '温まり ' + pct(c.warmAcc));
      }
      break;
    }

    case 'seat': {
      const s = g.seat, cfg = s.cfg;
      s.lock = Math.max(0, s.lock - dt);
      if (g.phase === 'play') {
        // 椅子の空き・埋まりが入れ替わる
        for (const ch of s.chairs) {
          ch.timer -= dt;
          if (ch.timer <= 0) {
            ch.free = !ch.free;
            if (!ch.free) ch.npc = Math.floor(Math.random() * 2);
            ch.timer = ch.free ? rand(cfg.freeLife[0], cfg.freeLife[1]) : rand(cfg.occLife[0], cfg.occLife[1]);
          }
        }
        if (g.t >= cfg.timeout) { // 確保できず床へ
          c.seatType = CONFIG.SEAT_FLOOR.name;
          c.seatMul = CONFIG.SEAT_FLOOR.mul;
          sfx('tapMiss');
          go('seat', 'done');
        }
      } else if (g.phase === 'done' && g.t >= CONFIG.SEAT_DONE_SEC) {
        go('gaiki', 'lead');
      }
      break;
    }

    case 'gaiki':
      if (g.phase === 'lead' && g.t >= CONFIG.BREATH_LEAD) {
        c.taps = [];
        c.best = [];
        go('gaiki', 'play');                 // 時間制限なし。「休憩をやめる」まで続く
      } else if (g.phase === 'done' && g.t >= CONFIG.BREATH_DONE_SEC) {
        actionDone(g.actId, c.breath * c.seatMul, 1, '呼吸 ' + pct(c.breath) + ' ' + c.seatType + '×' + c.seatMul.toFixed(1));
      }
      break;

    case 'timeup':
      if (g.t >= CONFIG.TIMEUP_SEC) finishStage('time');
      break;

    case 'cutin': {
      // 足音（歩いている間）と、入口に入る音
      const step = Math.floor(g.t / CONFIG.CUTIN_STEP_SEC), prev = Math.floor((g.t - dt) / CONFIG.CUTIN_STEP_SEC);
      if (g.t < CONFIG.CUTIN_WALK_SEC && step > prev) stepSound();
      if (g.t >= CONFIG.CUTIN_WALK_SEC && g.t - dt < CONFIG.CUTIN_WALK_SEC) sfx('splash', 0.8);
      if (g.t >= CONFIG.CUTIN_SEC) beginStage();
      break;
    }

    case 'ending':
      if (g.t >= CONFIG.ENDING_SEC) go('result', 'show');
      break;
  }
}

/* =====================================================================
 * 描画ヘルパー
 * ===================================================================== */
// 縁取り付き文字
function txt(s, x, y, size, color, align, bold, outline, ow) {
  ctx.font = (CONFIG.FONT_BOLD && bold !== false ? 'bold ' : '') + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline !== null) {
    ctx.lineWidth = ow || 4;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = outline || '#000';
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

// ドット絵風パネル（黒縁＋ハイライト）
function panel(x, y, w, h, fill) {
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(x, y + h - 3, w, 3);
}

function button(r, label, color) {
  ctx.fillStyle = '#000';
  ctx.fillRect(r.x + 4, r.y + 4, r.w, r.h);
  panel(r.x, r.y, r.w, r.h, color);
  txt(label, r.x + r.w / 2, r.y + r.h / 2, 16, '#fff', 'center', true, '#000', 4);
}

// 文字エリア（画面下部の固定ウィンドウ）。点滅させずにここへ表示する
// lines: 文字列 または [文字列, 色] の配列（最大3行）／next: 右下に「▼」（タップで進む）
const MSG = { x: 12, y: 52, w: 336, h: 76 }; // 文字は画面上部に集める（下部は選択肢）
function msgBox(lines, next) {
  const tl = tutLines();
  if (tl) lines = tl; // チュートリアルの案内を優先
  panel(MSG.x, MSG.y, MSG.w, MSG.h, '#14102a');
  ctx.fillStyle = '#ffd54a';
  ctx.fillRect(MSG.x + 4, MSG.y + 4, MSG.w - 8, 1); // 内側の飾り線
  ctx.fillRect(MSG.x + 4, MSG.y + MSG.h - 5, MSG.w - 8, 1);
  const n = lines.length, lh = 22;
  const y0 = MSG.y + MSG.h / 2 - (n - 1) * lh / 2;
  lines.forEach((l, i) => {
    const s = Array.isArray(l) ? l[0] : l, col = Array.isArray(l) ? l[1] : '#fff';
    txt(s, W / 2, y0 + i * lh, 15, col, 'center', false, null);
  });
  if (next) txt('▼', MSG.x + MSG.w - 10, MSG.y + MSG.h - 16, 12, '#ffd54a', 'right', false, null);
}

// チュートリアルの案内文（場面ごと。該当しなければ null）
function tutLines() {
  if (!PLAY_SCENES.includes(g.scene) || !ST().tutorial) return null;
  const Y = '#ffe082';
  switch (g.scene) {
    case 'hub':
      if (g.tutRetry && g.tutI === 1) return [['おしい！ ととのえなかった…', '#ff8a80'], 'もう一度「サウナ」から']; 
      return [
        [['まずはお風呂で体を温めよう', Y], '光っている「お風呂」をタップ'],
        [['次はサウナで汗をかこう', Y], '光っている「サウナ」をタップ'],
        [['汗をかいたら、水風呂で冷やそう', Y], '光っている「水風呂」をタップ'],
        [['最後は休憩。ここで、ととのう…', Y], '光っている「休憩」をタップ']
      ][g.tutI];
    case 'ofuro': return g.phase === 'hold' ? [['体温が上がっていく（タップで速く）', Y], '37.5℃くらいで左下の「出る」！'] : null;
    case 'sauna': return g.phase === 'hold' ? [['タップで温度アップ。40℃超えは倒れる！', Y], '39.5℃くらいで左下の「出る」！'] : null;
    case 'mizu': return g.phase === 'hold' ? [['体温が下がっていく。冷やしすぎは風邪！', Y], '37℃くらいで左下の「出る」！'] : null;
    case 'seat': return g.phase === 'play' ? [['空いている椅子（緑の枠）をタップ', Y], '良い椅子ほど、ととのいやすい'] : null;
    case 'gaiki': return g.phase === 'lead' || g.phase === 'play' ? [['円が点線に届く瞬間にタップ！', Y], '落ち着いたら右下の「休憩をやめる」'] : null;
  }
  return null;
}

// ブロック状の円（ドット絵風）
function pxCircle(cx, cy, r, color, b) {
  b = b || 4;
  ctx.fillStyle = color;
  for (let y = -r; y < r; y += b) {
    const yy = Math.abs(y + b / 2);
    const hw = Math.sqrt(Math.max(0, r * r - yy * yy));
    const w = Math.floor(hw / b) * b;
    if (w > 0) ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, b);
  }
}

// ドット絵のハート
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function drawHeart(cx, cy, s, color) {
  ctx.fillStyle = color;
  for (let j = 0; j < HEART.length; j++) {
    for (let i = 0; i < HEART[j].length; i++) {
      if (HEART[j][i] === 'X') ctx.fillRect(Math.round(cx + (i - 3.5) * s), Math.round(cy + (j - 3) * s), Math.ceil(s), Math.ceil(s));
    }
  }
}

// 湯気
function drawSteam() {
  for (const s of g.steam) {
    ctx.globalAlpha = (1 - s.life / s.max) * 0.5;
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(s.x / 2) * 2, Math.round(s.y / 2) * 2, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

// 横長ゲージ（v: 0〜1）
function gauge(y, v, color, label) {
  panel(30, y, 300, 26, '#222');
  ctx.fillStyle = color;
  ctx.fillRect(30, y, Math.round(300 * clamp(v, 0, 1)), 26);
  if (label) txt(label, W / 2, y + 13, 16, '#fff', 'center', true, '#000', 4);
}

// 上部バー（残り時間・工程・合計）と時間バー
// 上部バーの場面名（行動中は選んだ行動の名前を出す。行動は自由に選ぶので番号は付けない）
const STAGE_NAME = { hub: '行動えらび', choose: '部屋えらび', angry: '強制退出', nobose: 'のぼせ！', timeup: '閉館' };
function topBar() {
  const st = ST();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, 40);
  const rm = remainMin();
  if (st.tutorial) txt('練習中（時間無制限）', 8, 20, 13, '#80deea', 'left', true, '#000', 3);
  else txt('残り' + rm + '分', 8, 20, 15, rm <= st.gameMin * 0.15 ? '#ff6e6e' : '#ffd54a', 'left', true, '#000', 3);
  const act = CONFIG.ACTIONS[g.actId];
  let sname = STAGE_NAME[g.scene] || (act ? act.name : '');
  if (g.scene === 'mizu' && g.cur.coolOpt) sname = g.cur.coolOpt.name;   // ホテル: 水風呂／アイスサウナ
  if (g.scene === 'sauna') sname = roomCfg().name;                        // サウナ室の名前
  if (g.scene === 'seat') sname += '（席さがし）';
  if (g.scene === 'gaiki') sname += '（息を整える）';
  txt(sname, W / 2 - 6, 20, 15, '#fff', 'center', true, '#000', 3);
  // スコア・コンボは閉館まで表示しない
  // 時間バー
  const r = remainSec() / st.realSec;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 40, W, 7);
  ctx.fillStyle = r > 0.4 ? '#66d17a' : (r > 0.15 ? '#ffd54a' : '#ff5252');
  ctx.fillRect(0, 41, Math.round(W * r), 5);
  // 熱波士のHP
  if (st.boss) {
    const left = Math.max(0, st.boss.hp - g.total);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 47, W, 14);
    ctx.fillStyle = '#d84315';
    ctx.fillRect(70, 49, Math.round(286 * left / st.boss.hp), 10);
    txt('アツ丸HP', 4, 54, 11, '#ffab91', 'left', false, null);
  }
}

// 体温の換算（v: サウナの熱 / 水風呂の降下量 / お風呂の上昇量。0〜100）
function bodyTemp(kind, v) {
  const C = CONFIG, k = clamp(v / 100, 0, 1);
  if (kind === 'sauna') return lerp(C.BODY_TEMP, C.SAUNA_TEMP_MAX, Math.min(v / 100, 1.1)); // 36.5℃未満からも始まる
  if (kind === 'mizu') return lerp(C.MIZU_TEMP_START, C.MIZU_TEMP_MIN, k);
  return lerp(C.BATH_TEMP_START, C.BATH_TEMP_MAX, k);
}

// 体温計（ゲージの代わり）。hidden: 煙で見えない
function drawTemp(y, temp, hidden) {
  panel(60, y, 240, 50, '#141428');
  ctx.fillStyle = '#000'; ctx.fillRect(77, y + 7, 12, 30);    // 体温計のドット絵
  ctx.fillStyle = '#eee'; ctx.fillRect(79, y + 9, 8, 26);
  ctx.fillStyle = '#ff5252'; ctx.fillRect(81, y + 22, 4, 13);
  pxCircle(83, y + 40, 7, '#ff5252', 2);

  const col = temp >= 39.5 ? '#ff5252' : temp >= 38 ? '#ffab40' : temp <= 35.6 ? '#64b5f6' : '#fff';

// 行動えらびでの感想（直前の行動の出来ばえと、内部の流れ・コンボで変わる）
function hubComment() {
  const la = g.lastAct;
  if (!la) return 'さて、どこから行こうか…';
  if (la.fail) return la.fail === 'nobose' ? 'うぅ…のぼせた…' : '怒られちゃった…';
  if (ST().tutorial && g.tutRetry && g.tutI === 1) return '水風呂で冷やしすぎたかも…'; // チュートリアルのやり直し
  if (la.ev === 'bad') return 'うーん、順番がしっくりこない…';
  if (g.combo >= 7) return '宇宙が見えてきた…';
  if (g.combo >= 4) return 'かなりととのってきた…！';
  const q = la.q, t = g.lastType;
  if (t === 'sauna') return q >= 0.85 ? 'あっつい！ いい汗かいた' : (q >= 0.5 ? 'ほどよく温まった' : 'まだ物足りないな…');
  if (t === 'water') return q >= 0.8 ? 'キーンと引き締まった！' : '冷え方がイマイチ…';
  if (t === 'rest') return q >= 0.7 ? (g.combo >= 2 ? 'ととのってきた…' : 'ふぅ…落ち着く') : '呼吸が乱れた…';
  if (t === 'bath') return q >= 0.8 ? 'ぽかぽか、極楽〜' : '湯加減がイマイチ…';
  if (t === 'vihta') return q >= 0.9 ? '血が巡ってきた！' : 'もっと叩けたな…';
  return 'ふぅ';
}

/* =====================================================================
 * キャラクター（PNG素材。無ければ矩形で描画）
 * ===================================================================== */
const SKIN = [255, 206, 160], SKIN_HOT = [232, 60, 48], SKIN_COLD = [160, 196, 255];

// 矩形リストを描画。座標は左上基準のグリッド。原点は足元中央。outline=true で黒縁取り
function drawParts(list, gridW, gridH, cx, baseY, u, sx, sy, outline) {
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(sx, sy);
  ctx.translate(-gridW * u / 2, -gridH * u);
  if (outline) {
    ctx.fillStyle = '#000';
    for (const p of list) {
      if (p[5]) continue; // 細部は縁取りしない
      ctx.fillRect((p[0] - 0.5) * u, (p[1] - 0.5) * u, (p[2] + 1) * u, (p[3] + 1) * u);
    }
  }
  for (const p of list) {
    ctx.fillStyle = p[4];
    ctx.fillRect(p[0] * u, p[1] * u, p[2] * u, p[3] * u);
  }
  ctx.restore();
}

// PNG素材でキャラを描く（輪郭 → 肌（色乗算）→ 服 → 表情の順）
let tintCv = null;
function drawCharSprite(cx, baseY, u, sx, sy, pose, face, skinCss) {
  const out = SPR['char_outline_' + pose], skin = SPR['char_skin_' + pose];
  const cloth = SPR['char_cloth_' + pose], fc = SPR['face_' + face];
  const w = out.width, h = out.height;
  const k = u / CONFIG.SPRITE_PX_PER_GRID;
  // 肌の色替え用の作業キャンバス（肌画像に肌色を乗算し、肌の形で切り抜く）
  if (!tintCv) tintCv = document.createElement('canvas');
  if (tintCv.width !== w || tintCv.height !== h) { tintCv.width = w; tintCv.height = h; }
  const t = tintCv.getContext('2d');
  t.globalCompositeOperation = 'source-over';
  t.clearRect(0, 0, w, h);
  t.drawImage(skin, 0, 0);
  t.globalCompositeOperation = 'multiply';
  t.fillStyle = skinCss;
  t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = 'destination-in';
  t.drawImage(skin, 0, 0);
  t.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(sx, sy);
  ctx.translate(-w * k / 2, -(h - CONFIG.SPRITE_MARGIN) * k);
  ctx.drawImage(out, 0, 0, w * k, h * k);
  ctx.drawImage(tintCv, 0, 0, w * k, h * k);
  ctx.drawImage(cloth, 0, 0, w * k, h * k);
  ctx.drawImage(fc, 0, 0, w * k, h * k);
  ctx.restore();
}

// サウナーおじさん。face: normal / hot / chill / zen
function drawChar(cx, baseY, u, o) {
  o = o || {};
  const heat = o.heat || 0, cold = o.cold || 0, face = o.face || 'normal';
  const sx = o.sx || 1, sy = o.sy || 1;
  let sk = mixCol(SKIN, SKIN_HOT, heat);
  sk = mixCol(sk, SKIN_COLD, cold);
  const S = rgb(sk), Sd = rgb(sk.map(v => Math.round(v * 0.82)));
  const K = '#000';
  const zen = face === 'zen';

  const body = [
    [3, 5, 1, 2, S], [12, 5, 1, 2, S],               // 耳
    [4, 3, 8, 6, S],                                  // 顔
    [4, 0, 8, 3, '#fff'], [4, 2, 8, 1, '#cfd8e8'],    // 頭のタオル
    [7, 9, 2, 1, S],                                  // 首
    [3, 10, 10, 7, S]                                 // 胴
  ];
  if (zen) {
    body.push([2, 10, 2, 3, S], [12, 10, 2, 3, S], [6, 11, 4, 3, Sd]); // 合掌
  } else {
    body.push([1, 10, 2, 6, S], [13, 10, 2, 6, S]);                     // 腕
  }
  body.push(
    [3, 14, 10, 3, '#fff'], [3, 16, 10, 1, '#cfd8e8'],  // 腰タオル
    [4, 17, 3, 5, S], [9, 17, 3, 5, S]                   // 脚
  );

  let d = [];
  if (face === 'normal') {
    d = [[6, 5, 1, 2, K, 1], [9, 5, 1, 2, K, 1], [7, 7, 2, 1, '#a33', 1]];
  } else if (face === 'hot') {
    d = [[5, 5, 1, 1, K, 1], [6, 6, 1, 1, K, 1], [5, 7, 1, 1, K, 1],
         [10, 5, 1, 1, K, 1], [9, 6, 1, 1, K, 1], [10, 7, 1, 1, K, 1],
         [7, 7, 2, 2, '#600', 1]];
  } else if (face === 'chill') {
    d = [[5, 6, 2, 1, K, 1], [9, 6, 2, 1, K, 1], [7, 8, 2, 1, '#a33', 1]];
  } else if (zen) {
    d = [[5, 6, 1, 1, K, 1], [6, 5, 1, 1, K, 1], [7, 6, 1, 1, K, 1],
         [9, 6, 1, 1, K, 1], [10, 5, 1, 1, K, 1], [11, 6, 1, 1, K, 1],
         [4, 7, 1, 1, '#ff7fa8', 1], [11, 7, 1, 1, '#ff7fa8', 1],
         [6, 7, 1, 1, '#a33', 1], [7, 8, 2, 1, '#a33', 1], [9, 7, 1, 1, '#a33', 1]];
  }

  const pose = zen ? 'zen' : 'normal';
  if (SPR['char_outline_' + pose] && SPR['char_skin_' + pose] && SPR['char_cloth_' + pose] && SPR['face_' + face]) {
    drawCharSprite(cx, baseY, u, sx, sy, pose, face, rgb(sk)); // PNG素材で描画
  } else {
    drawParts(body, 16, 22, cx, baseY, u, sx, sy, true);       // フォールバック（矩形描画）
    drawParts(d, 16, 22, cx, baseY, u, sx, sy, false);
  }

  // 汗
  if (heat > 0.3) {
    const sw = [];
    for (let i = 0; i < 3; i++) {
      const x = [2, 13, 12][i], y0 = [3, 4, 1][i];
      sw.push([x, y0 + ((g.anim * 3 + i * 0.7) % 1) * 4, 1, 1.5, '#6cf', 1]);
    }
    drawParts(sw, 16, 22, cx, baseY, u, sx, sy, false);
  }
}

// 後光（放射状の光線と光輪）
function drawHalo(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  const n = 12, rot = g.anim * 0.5;
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    ctx.fillStyle = i % 2 ? 'rgba(255,240,120,0.38)' : 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.13) * 520, Math.sin(a - 0.13) * 520);
    ctx.lineTo(Math.cos(a + 0.13) * 520, Math.sin(a + 0.13) * 520);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  pxCircle(cx, cy, 64, 'rgba(255,245,160,0.55)', 4);
  pxCircle(cx, cy, 48, 'rgba(255,255,230,0.7)', 4);
}

// 休憩スペース（外気浴ベンチ）
// 夜景のビル群（窓の明かりは位置から決める＝毎フレーム同じ）
function drawSkyline(x0, x1, yBase, maxH, dark, lit) {
  for (let x = x0, i = 0; x < x1; i++) {
    const w = 26 + (i * 37) % 30, h = maxH * (0.4 + ((i * 53) % 60) / 100);
    ctx.fillStyle = dark;
    ctx.fillRect(x, yBase - h, w, h);
    ctx.fillStyle = lit;
    for (let wy = yBase - h + 6; wy < yBase - 6; wy += 10) {
      for (let wx = x + 4; wx < x + w - 4; wx += 8) {
        if (((wx * 7 + wy * 13) % 5) < 2) ctx.fillRect(wx, wy, 4, 4);
      }
    }
    x += w + 4;
  }
}

    ctx.fillStyle = '#66bb6a';

  }
  gauge(140, k, rgb(mixCol([255, 200, 200], [230, 30, 60], k)), '血行 ' + pct(k));
  const lines = [];
  if (g.phase === 'lead') lines.push('ヴィヒタ（白樺の枝）を手に取った…');
  else if (g.phase === 'play') {
    lines.push(['連打で体をたたけ！', '#7dff9a']);

    lines.push(k >= 1 ? '血行バツグン！' : (k >= 0.5 ? 'いい感じに血が巡る' : 'ちょっと物足りない…'));

  }
  msgBox(lines, false);
}

function drawLake() {
  const L = g.lake, c = g.cur;
  bgForest(false);

  ctx.fillStyle = '#cfe8f5';
  ctx.fillRect(-12, 440, W + 24, 110);

  const hx = 30 + 300 * L.hole, hw = Math.max(16, 300 * CONFIG.LAKE_HOLE_HALF);
  ctx.fillStyle = '#000'; ctx.fillRect(hx - hw - 3, 477, hw * 2 + 6, 30);
  ctx.fillStyle = '#1c4f7a'; ctx.fillRect(hx - hw, 480, hw * 2, 24);
  // キャラ（走る → 跳ぶ → 穴に落ちる／氷に激突）
  const x = 30 + 300 * L.pos;
  if (g.phase === 'play') {
    drawChar(x, 465 - Math.abs(Math.sin(g.anim * 14)) * 4, 3, { heat: 0.6, face: 'normal' });
  } else {
    const j = clamp(g.t / CONFIG.LAKE_JUMP_SEC, 0, 1);
    if (g.phase === 'jump' && j < 1) {
      drawChar(x, 465 - Math.sin(j * Math.PI) * 90 + j * 30, 3, { heat: 0.6, face: 'hot' });

      txt('ザブーン！', hx, 420, 20, '#fff', 'center', true, '#1c4f7a', 5);
    } else {
      drawChar(x, 492, 3, { cold: 0.5, face: 'hot', sy: 0.6, sx: 1.3 });
      txt('ゴンッ！', x, 420, 20, '#ff8a80', 'center', true, '#000', 5);
    }
  }
  const lines = [];
  if (g.phase === 'play') { lines.push('タップで氷の穴へダイブ！'); lines.push('穴の真上で飛び込め'); }
  else if (g.phase === 'jump') lines.push('とうっ！');

    lines.push(L.hit ? ['ドボン！ キンキンの湖', '#7dff9a'] : ['氷に激突…', '#ff8a80']);
    lines.push('冷却適正 ' + pct(c.cool));
  }
  msgBox(lines, false);
}

// 入館カットイン: キャラが施設の入口へ歩いて入っていく
function drawCutin() {
  const C = CONFIG, st = ST(), t = g.t;
  const door = drawFacade(st.theme.hub);
  const k = clamp(t / C.CUTIN_WALK_SEC, 0, 1);
  const x = lerp(-40, door.x, k);
  const fade = clamp((t - C.CUTIN_WALK_SEC) / 0.4, 0, 1);          // 入口に入ると消える
  ctx.globalAlpha = 1 - fade;
  drawChar(x, door.y - Math.abs(Math.sin(t * 12)) * 4 * (1 - k), 4, { face: 'normal', sx: 1 - fade * 0.3, sy: 1 - fade * 0.3 });
  ctx.globalAlpha = 1;
  // 映画のような上下の黒帯と、施設名の帯
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillRect(0, H - 44, W, 44);
  const bx = lerp(W, 0, clamp(t / 0.35, 0, 1));
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(bx, 70, W, 56);
  txt(st.name, bx + W / 2, 98, 26, '#fff', 'center', true, '#000', 6);
  if (t >= C.CUTIN_SKIP_SEC) txt('タップで飛ばす', W / 2, H - 22, 12, '#9e9e9e', 'center', false, null);
}

function drawSauna() {
  const c = g.cur, st = ST(), h = clamp(c.heat / 100, 0, 1);
  bgSauna(h);
  const ev = eventState(), room = roomCfg();
  const hot = ev.state === 'active' || roomLoylyOn() || c.boostT > 0;
  if (hot) { // ロウリュ中は白い蒸気
    ctx.fillStyle = 'rgba(255,255,255,' + (0.18 + 0.06 * Math.sin(g.anim * 10)) + ')';
    ctx.fillRect(-12, -12, W + 24, H + 24);
  }
  drawSteam();
  if (st.boss) {
    const pose = g.boss.hitT > 0 ? 'hit' : (g.phase === 'hold' && g.boss.waveT <= st.boss.warn ? 'warn' : 'idle');
    drawBoss(290, 470, 5, pose);
  }
  const env = heartEnv(g.heartPhase % 1);
  const sc = g.phase === 'hold' ? 1 + 0.045 * h * env : 1;
  drawChar(st.boss ? 150 : 180, BASE_Y, 6, { heat: h, face: h > 0.55 ? 'hot' : 'normal', sx: sc, sy: sc });

  const gy = 140;
  drawTemp(gy, bodyTemp('sauna', c.heat), room.smoke); // スモークサウナは煙で体温計が見えない
  const hs = 5 + env * 2 * (0.5 + h);
  drawHeart(46, gy + 76, hs, '#ff3b5c');
  const bpm = Math.round(lerp(CONFIG.HEART_BPM_MIN, CONFIG.HEART_BPM_MAX, h));
  txt(bpm + ' bpm', 82, gy + 76, 16, '#ff9ab0', 'left', true, '#000', 3);

  // スモークサウナは煙で視界が悪い
  if (room.smoke) {
    ctx.fillStyle = 'rgba(60,48,38,0.45)';
    ctx.fillRect(-12, -12, W + 24, H + 24);
  }
  if (g.phase === 'hold') {
    drawFeel();
    button(EXIT_BTN, '出る', '#455a64');
    saunaBtns().forEach(b => button(b.r, b.label, b.color)); // ロウリュ・ヴィヒタ
  }
  if (g.vihtaSwing > 0 || (c.vihtaT || 0) > 0) {            // ヴィヒタでたたく
    drawVihta(240, 440, g.vihtaSwing > 0 ? 1 : 0);
    if (g.vihtaSwing > 0) txt('ペシッ', 250, 380, 18, '#fff', 'center', true, '#2e7d32', 5);
  }
  // 高温ボーナスの表示
  if (c.hotHeat > 0) txt('高温ボーナス中', 330, 140 + 76, 13, '#ffcc80', 'right', true, '#000', 3);

  // 文字エリア
  const lines = [];
  if (ev.state === 'warn') lines.push(['まもなく自動ロウリュ…！', '#ffb74d']);
  if (ev.state === 'active') lines.push(['自動ロウリュ発動！ 激熱！', '#ff6e6e']);
  if (roomLoylyOn()) lines.push(['ロウリュ！ 耐えれば高温ボーナス', '#ff6e6e']);
  if (g.phase === 'hold' && lines.length < 2) {
    if (room.self) {
      const left = CONFIG.SELF_LOYLY_LIMIT - c.selfCount;
      lines.push(left > 0 ? ['ロウリュボタン（あと' + left + '回は平気）', '#ffcc80']
        : ['おじさん「…おい」 次やったら怒られる', '#ff8a80']);
    } else if (st.finland) {
      lines.push((c.vihtaT || 0) > 0 ? ['血行アップ！ 体温が上がりやすい', '#7dff9a'] : 'ヴィヒタで血行アップ。タップで温度アップ');
    } else {
      lines.push('タップで温度アップ！');
    }
  }
  if (g.phase === 'hold') {
    if (h >= CONFIG.SAUNA_WARN) lines.push(['あぶない！ 「出る」で退出！', '#ff6e6e']);
    else if (lines.length < 2) lines.push('体温40℃超えでのぼせ。「出る」で退出');
  } else if (g.phase === 'exit') {
    lines.push('退出！');
    lines.push(['熱蓄積 ' + pct(h) + '（体温 ' + bodyTemp('sauna', c.heat).toFixed(1) + '℃）', '#ffd54a']);
  }
  msgBox(lines.slice(0, 3), false);
}

// 水風呂・お風呂（長押し→ゾーンで離す）
function drawZone() {
  const c = g.cur, st = ST(), z = zoneCfg(), mizu = g.scene === 'mizu';
  // 見た目用の進み具合（0〜1）: 水風呂は38℃→35℃、お風呂は36℃→40℃
  const k = mizu ? clamp((CONFIG.MIZU_TEMP_START - c.T) / (CONFIG.MIZU_TEMP_START - CONFIG.MIZU_TEMP_MIN), 0, 1)
    : clamp((c.T - CONFIG.BATH_TEMP_START) / (CONFIG.BATH_TEMP_MAX - CONFIG.BATH_TEMP_START), 0, 1);
  const co = c.coolOpt, iceRoom = mizu && co && co.room;
  if (mizu) bgBath(co ? co.name : '水風呂', co ? co.temp : st.mizuTc + '℃', st.ice ? '#e1f5fe' : '#6cf');
  else if (st.finland) bgForest(true);
  else bgBath('お風呂', ST().bathTc + '℃', '#ffab91');
  // 体の状態（水風呂: サウナの熱が冷める / お風呂: 冷えた体が温まる）
  const heat = mizu ? clamp((c.T - CONFIG.BODY_TEMP) / 3.5, 0, 1) : k * 0.45;
  const cold = mizu ? k * 0.8 : 0.5 * (1 - k);
  const face = mizu ? (k > 0.2 ? 'chill' : 'normal') : (k > 0.25 ? 'chill' : 'normal');
  if (!mizu && st.finland) { // 焚き火で温まる
    drawChar(180, BASE_Y, 6, { heat, cold, face });
    drawFire(285, BASE_Y);
  } else if (iceRoom) { // アイスサウナ: 水ではなく凍った部屋
    ctx.fillStyle = '#dff4ff';
    ctx.fillRect(-12, 440, W + 24, 220);
    drawChar(180, BASE_Y, 6, { heat, cold, face });
    ctx.fillStyle = 'rgba(200,235,255,' + (0.25 + 0.2 * k) + ')';
    ctx.fillRect(-12, -12, W + 24, H + 24);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 24; i++) ctx.fillRect((i * 53 + g.anim * 20) % W, (i * 97 + g.anim * 60) % 540, 4, 4); // 雪
  } else {
    drawChar(180, BASE_Y + 50, 6, { heat, cold, face });
    if (mizu && st.ice) { // 氷
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 5; i++) ctx.fillRect(30 + i * 64, 452 + (i % 2) * 6, 18, 12);
    }
    bgWater(mizu ? st.theme.water : '#e0a458', mizu ? 0.55 : 0.6);
  }
  if (!mizu) drawSteam();

  // 体温（目安は出さない）
  const gy = 140;
  drawTemp(gy, c.T, false);

  if (g.phase === 'hold') { drawFeel(); button(EXIT_BTN, '出る', '#455a64'); }
  const lines = [];
  if (g.phase === 'hold') {
    lines.push(['ちょうどいい体温で「出る」と高得点', '#7dff9a']);
    lines.push(mizu ? 'タップで深く沈む（速く冷える）' : (st.finland ? 'タップで火に近づく（速く温まる）' : 'タップで肩までつかる（速く温まる）'));
    if (iceRoom) lines.push(['−25℃！ 一瞬で冷えるぞ', '#bfe9ff']);
    else if (mizu && g.lastType === 'sauna' && g.lastRoom === 'salt') lines.push(['塩サウナ効果で多少ズレても平気', '#bfe9ff']);
  } else if (g.phase === 'done') {
    const err = Math.abs(c.T - z.temp);
    const label = err <= z.zone * 0.5 ? 'ドンピシャ！' : (err <= z.zone ? 'いい感じ！' : (mizu ? (c.T > z.temp ? '冷え足りない…' : '冷えすぎ…') : (c.T < z.temp ? '温まり足りない…' : 'のぼせ気味…')));
    lines.push([label, err <= z.zone ? '#7dff9a' : '#ffd54a']);
    // 狙いの体温は表示しない（体温の数値と結果の手ごたえで覚える）
    lines.push((mizu ? '冷却適正 ' + pct(c.cool) : '温まり ' + pct(c.warmAcc)) + '　体温 ' + c.T.toFixed(1) + '℃');
  }
  msgBox(lines, false);
}

function drawSeat() {
  const s = g.seat, cfg = s.cfg, c = g.cur;
  // 休憩スペース（ステージごとの配色）
  const th = ST().theme;
  const act = CONFIG.ACTIONS[g.actId];
  if (act.outdoor) bgRest();               // 外気浴は屋外
  else if (g.actId === 'inrest') bgInRest(); // 内気浴は屋内
  else bgBands(th.seatBg, -12, 440);
  ctx.fillStyle = act.outdoor || g.actId === 'inrest' ? 'rgba(0,0,0,0)' : th.seatFloor;
  ctx.fillRect(-12, 440, W + 24, 220);
  txt(act.outdoor ? '外気浴スペース' : (g.actId === 'inrest' ? '内気浴スペース' : '休憩スペース'), 180, 180, 18, '#ffe0b2', 'center', true, '#000', 4);
  // 制限時間バー
  if (g.phase === 'play') {
    const r = 1 - g.t / cfg.timeout;
    const by = 140;
    panel(30, by, 300, 12, '#222');
    ctx.fillStyle = '#ffb74d';
    ctx.fillRect(30, by, Math.round(300 * clamp(r, 0, 1)), 12);
  }
  s.chairs.forEach((ch, i) => {
    const r = chairRect(i);
    if (ch.free && g.phase === 'play') { // 空席は枠で強調（点滅なし）
      ctx.fillStyle = '#7dff9a';
      ctx.fillRect(r.x - 5, r.y + 18, r.w + 10, 82);
    }
    drawChair(r.x, r.y + 24, r.w, ch.type);
    if (i === s.picked) drawChar(r.x + r.w / 2, r.y + 84, 3, { face: 'chill' });
    else if (!ch.free) drawNpc(r.x + r.w / 2, r.y + 72, ch.npc, 5);
    if (i === s.bump && s.lock > 0) txt('ムッ', r.x + r.w / 2, r.y + 6, 14, '#ff8a80', 'center', true, '#000', 3);
    txt(CONFIG.SEAT_TYPES[ch.type].name, r.x + r.w / 2, r.y + 112, ch.type === 0 ? 9 : 11, '#fff', 'center', false, '#000', 3);
    txt('×' + CONFIG.SEAT_TYPES[ch.type].mul.toFixed(1), r.x + r.w / 2, r.y + 128, 11, '#ffd54a', 'center', false, '#000', 3);
  });
  if (s.picked < 0) drawChar(180, BASE_Y, 5, { face: g.phase === 'done' ? 'hot' : 'normal', cold: 0.3 });

  if (g.phase === 'play') {
    msgBox(['空いている椅子（緑の枠）をタップ！', '残り ' + Math.max(0, cfg.timeout - g.t).toFixed(1) + '秒　良い椅子ほど高補正'], false);
  } else {
    msgBox(c.seatType === CONFIG.SEAT_FLOOR.name
      ? [['席がない…床で休憩', '#ff8a80'], '休憩補正 ×' + c.seatMul.toFixed(1)]
      : [[c.seatType + 'を確保！', '#7dff9a'], '休憩補正 ×' + c.seatMul.toFixed(1)], false);
  }
}

function drawGaiki() {
  const c = g.cur, C = CONFIG, fin = ST().finland;
  if (g.actId === 'inrest') bgInRest(); else bgRest(); // ステージごとの休憩スペース（内気浴は屋内）
  // 確保した椅子（床なら敷物、フィンランドは丸太）
  const ti = fin ? -1 : CONFIG.SEAT_TYPES.findIndex(t => t.name === c.seatType);
  if (fin) {
    ctx.fillStyle = '#000'; ctx.fillRect(97, 487, 166, 36);
    ctx.fillStyle = '#8d6e63'; ctx.fillRect(100, 490, 160, 30);
    ctx.fillStyle = '#d7ccc8'; ctx.fillRect(100, 490, 12, 30); ctx.fillRect(248, 490, 12, 30); // 年輪
  } else if (ti >= 0) drawChair(130, 446, 100, ti);
  else { ctx.fillStyle = '#795548'; ctx.fillRect(110, 506, 140, 14); }
  const zen = g.phase === 'done' && c.breath >= 0.8;
  drawChar(180, BASE_Y - (ti >= 0 ? 18 : 0), 5, { cold: 0.25, face: zen ? 'zen' : 'chill' });

  const P = C.BREATH_PERIOD, playing = g.phase === 'play';
  const tt = playing ? g.t : 0;
  const rMid = (C.BREATH_R_MIN + C.BREATH_R_MAX) / 2, rAmp = (C.BREATH_R_MAX - C.BREATH_R_MIN) / 2;
  const r = playing ? rMid - rAmp * Math.cos(2 * Math.PI * tt / P) : C.BREATH_R_MIN;
  const cx = 180, cy = 300;
  ctx.save();
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, C.BREATH_R_MAX + 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  pxCircle(cx, cy, r + 4, '#000', 4);
  pxCircle(cx, cy, r, '#7fe7ff', 4);
  pxCircle(cx, cy, r * 0.62, '#c9f6ff', 4);
  if (playing) { // 拍のタイミングで光る
    const k = Math.max(0, Math.round(tt / P - 0.5));
    if (Math.abs(tt - (k + 0.5) * P) < 0.1) pxCircle(cx, cy, C.BREATH_R_MAX + 12, 'rgba(255,240,120,0.35)', 4);
  }
  drawTemp(140, g.temp, false); // 休憩中は体温がゆっくり36.5℃へ戻る
  if (g.phase !== 'done') button(EXIT_BTN, '休憩をやめる', '#2e7d32');

  const lines = [];
  if (g.phase === 'lead') {
    lines.push('息を整えて…');
    lines.push('円が点線に届く瞬間にタップ！');
  } else if (playing) {
    lines.push((Math.sin(2 * Math.PI * tt / P) > 0 ? 'すーっ（吸って）' : 'はーっ（吐いて）') + '　落ち着いたらやめる');

// 万華鏡の背景（中心から放射状に、鏡写しの模様が回る）
function drawKaleido(t) {
  const n = CONFIG.ENDING_KALEIDO_N, R = 460, cx = 180, cy = 300;
  const step = Math.PI * 2 / n;
  for (let i = 0; i < n; i++) {
    ctx.save();
    ctx.translate(cx, cy);
    // 1つおきに鏡写し（鏡写しの扇形は次の境界から逆向きに描いて隙間をなくす）
    ctx.rotate((i % 2 ? i + 1 : i) * step + t * 0.15);
    if (i % 2) ctx.scale(1, -1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(R, 0);
    ctx.lineTo(R * Math.cos(step), R * Math.sin(step));
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = 'hsl(' + ((t * 30) % 360) + ',60%,22%)';
    ctx.fillRect(0, 0, R, R);
    for (let j = 0; j < 14; j++) {           // 中心から外へ流れる色の粒
      const r = (j * 41 + t * 50) % R;
      const a = ((j * 0.61) % 1) * step;
      const size = 6 + (j % 4) * 6 + r * 0.04;
      pxCircle(Math.cos(a) * r, Math.sin(a) * r, size, 'hsl(' + ((j * 47 + t * 60) % 360) + ',90%,62%)', 4);
    }
    ctx.restore();
  }
}

// 物悲しい下降音（ととのわなかったとき。素材を使わず合成）
// ステージ開始のジングル（洞窟に入るような、上がっていく和音。素材を使わず合成）
function stageJingle() {
  if (!snd.ctx) return;
  try {
    const notes = [261.6, 329.6, 392.0, 523.3, 659.3];
    notes.forEach((f, i) => {
      const t0 = snd.ctx.currentTime + 0.05 + i * 0.11;
      const len = i === notes.length - 1 ? 0.9 : 0.16;
      const o = snd.ctx.createOscillator(), gn = snd.ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t0);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      o.connect(gn); gn.connect(snd.sfxGain);
      o.start(t0); o.stop(t0 + len + 0.05);
    });
  } catch (e) { /* 再生失敗は無視 */ }
}

// 足音（短い低音）
function stepSound() {
  if (!snd.ctx) return;
  try {
    const t0 = snd.ctx.currentTime;
    const o = snd.ctx.createOscillator(), gn = snd.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(140, t0);
    o.frequency.exponentialRampToValueAtTime(70, t0 + 0.05);
    gn.gain.setValueAtTime(0.12, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
    o.connect(gn); gn.connect(snd.sfxGain);
    o.start(t0); o.stop(t0 + 0.08);
  } catch (e) { /* 再生失敗は無視 */ }
}

function sadJingle() {
  if (!snd.ctx) return;
  try {
    [392, 349.2, 311.1, 261.6].forEach((f, i) => {
      const t0 = snd.ctx.currentTime + i * 0.38;
      const o = snd.ctx.createOscillator(), gn = snd.ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t0);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + (i === 3 ? 1.0 : 0.34));
      o.connect(gn); gn.connect(snd.sfxGain);
      o.start(t0); o.stop(t0 + 1.1);
    });
  } catch (e) { /* 再生失敗は無視 */ }
}

  txt('次は「近所の銭湯」に挑戦しよう', 180, 482, 15, '#5d4037', 'center', true, '#fff', 4);
  if (g.t >= C.RESULT_LOCK_SEC) {
    button(BTN_RETRY, 'もう一度', '#e64a19');
    button(BTN_SELECT, 'ステージ', '#00897b');
    button(BTN_TITLE, 'タイトル', '#3949ab');
  }
}

// 倒れたときの結果画面（スコア0）
function drawCollapseResult() {
  const C = CONFIG, st = ST(), hot = g.collapse === 'hot';
  bgBands(hot ? ['#3e1010', '#4a1414'] : ['#0d1b3e', '#122452'], -12, 660);
  txt('ステージ結果', 180, 24, 20, '#ffd54a', 'center', true, '#000', 5);
  txt(st.name, 180, 52, 15, '#fff', 'center', false, '#000', 4);
  drawChar(180, 230, 5, { heat: hot ? 1 : 0, cold: hot ? 0 : 1, face: 'hot' });
  panel(30, 246, 300, 96, 'rgba(10,10,30,0.9)');
  txt(hot ? '病院送り……' : '風邪を引いた……', 180, 282, 30, hot ? '#ff8a80' : '#b3e5fc', 'center', true, '#000', 7);
  txt(hot ? '体温の上げすぎに注意しよう' : '冷やしすぎに注意しよう', 180, 320, 13, '#fff', 'center', false, null);
  txt('0 点', 180, 380, 34, '#9e9e9e', 'center', true, '#000', 7);
  txt('ハイスコア ' + (g.hi[st.id] || 0), 180, 416, 15, '#ffe082', 'center', false, '#000', 4);
  txt('倒れたら、それまでの記録はすべて無効', 180, 456, 13, '#e0d4f5', 'center', false, '#000', 3);
  if (g.t >= C.RESULT_LOCK_SEC) {
    button(BTN_RETRY, 'もう一度', '#e64a19');
    button(BTN_SELECT, 'ステージ', '#00897b');
    button(BTN_TITLE, 'タイトル', '#3949ab');
  }
}

/* =====================================================================
 * 描画（全体）
 * ===================================================================== */
// 画面の揺れ量（サウナの心拍・のぼせ直前・熱波・氷点下の震え）
function shakeOffset() {
  const c = g.cur;
  let amp = 0;
  if (g.scene === 'sauna' && g.phase === 'hold') {
    const h = clamp(c.heat / 100, 0, 1);
    const env = heartEnv(g.heartPhase % 1);
    amp = CONFIG.HEART_SHAKE_MAX * Math.pow(h, 1.4) * (0.15 + 0.85 * env);
  } else if (g.scene === 'freeze') {
    amp = 2.5;
  } else if (g.scene === 'nobose' && g.t < CONFIG.NOBOSE_MELT_START) {
    amp = CONFIG.HEART_SHAKE_MAX;
  } else if (g.scene === 'mizu' && g.phase === 'hold' && ST().ice) {
    amp = CONFIG.ICE_SHAKE;
  }
  if (g.shakeKick > 0) amp += 8;
  if (amp <= 0) return { x: 0, y: 0 };
  return { x: (Math.random() * 2 - 1) * amp, y: (Math.random() * 2 - 1) * amp };
}

function draw() {
  ctx.setTransform(renderK, 0, 0, renderK, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  const sh = shakeOffset();
  ctx.translate(Math.round(sh.x), Math.round(sh.y));
  switch (g.scene) {
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'cutin': drawCutin(); break;
    case 'intro': drawIntro(); break;
    case 'sauna': drawSauna(); break;
    case 'nobose': drawNobose(); break;
    case 'choose': drawChoose(); break;
    case 'angry': drawAngry(); break;
    case 'vihta': drawVihtaScene(); break;
    case 'lake': drawLake(); break;
    case 'mizu':
    case 'ofuro': drawZone(); break;
    case 'seat': drawSeat(); break;
    case 'gaiki': drawGaiki(); break;
    case 'hub': drawHub(); break;
    case 'timeup': drawTimeup(); break;
    case 'ending': drawEnding(); break;
    case 'freeze': drawFreeze(); break;
    case 'result': drawResult(); break;
  }
  ctx.restore();

  // 揺れない前景: 心拍に合わせた赤い周辺減光と上部バー
  if ((g.scene === 'sauna' && g.phase === 'hold') || g.scene === 'nobose') {
    const h = clamp(g.cur.heat / 100, 0, 1);
    const env = heartEnv(g.heartPhase % 1);
    const a = h * 0.55 * (0.6 + 0.4 * env);
    const gr = ctx.createRadialGradient(180, 320, 110, 180, 320, 420);
    gr.addColorStop(0, 'rgba(180,0,0,0)');
    gr.addColorStop(1, 'rgba(180,0,0,' + a + ')');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }
  if (PLAY_SCENES.indexOf(g.scene) >= 0 || g.scene === 'timeup') topBar();
  drawMute();
}

/* =====================================================================
 * メインループ
 * ===================================================================== */
let lastTs = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000 || 0, 0, 0.05); // 大きな飛びは丸める
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
